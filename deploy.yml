# Welcome to the Akash Network! 🚀
# This file is called a Stack Definition Language (SDL) file.
# It tells the Akash Network what resources you need and how to run your container.
# Learn more at https://akash.network/docs/getting-started/stack-definition-language/

---
version: "2.0"

services:
  web:
    image: ghcr.io/akash-network/hello-akash-world:2.1.0
    expose:
      - port: 3000
        as: 80
        to:
          - global: true

profiles:
  compute:
    web:
      resources:
        cpu:
          units: 1
        memory:
          size: 1Gi
        storage:
          size: 1Gi
  placement:
    dcloud:
      pricing:
        web:
          denom: uakt
          amount: 10000

deployment:
  web:
    dcloud:
      profile: web
      count: 1
